<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540"><rect width="960" height="540" rx="24" fill="#191625"/><text x="54" y="78" font-family="Arial" font-size="30" fill="#f6f1ff">A small search filter</text><text x="54" y="114" font-family="Arial" font-size="17" fill="#b9adce">JavaScript · return a new array</text><text x="65" y="195" font-family="monospace" font-size="23" fill="#a994ff">const topics = [&quot;React&quot;, &quot;CSS&quot;, &quot;Biology&quot;];</text><text x="65" y="245" font-family="monospace" font-size="23" fill="#f5f1ff">const query = &quot;re&quot;;</text><text x="65" y="295" font-family="monospace" font-size="23" fill="#ffc187">const matches = topics.filter(topic =&gt;</text><text x="65" y="345" font-family="monospace" font-size="23" fill="#a994ff">  topic.toLowerCase().includes(query)</text><text x="65" y="395" font-family="monospace" font-size="23" fill="#f5f1ff">); // [&quot;React&quot;]</text><text x="54" y="500" font-family="Arial" font-size="15" fill="#b9adce">BTB / Learning notes</text></svg>